name: Release

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "${PREV_TAG}..${TAG}")
          else
            NOTES=$(git log --pretty=format:"- %s" "${TAG}")
          fi
          VERSION="${TAG#v}"
          {
            echo "body<<EOF"
            echo "## Install"
            echo ""
            echo '```shell'
            echo "npx @eat-pray-ai/wingman@${VERSION} card"
            echo "npx @eat-pray-ai/wingman@${VERSION} resume"
            echo '```'
            echo ""
            echo "[![npm](https://img.shields.io/npm/v/@eat-pray-ai/wingman)](https://www.npmjs.com/package/@eat-pray-ai/wingman/v/${VERSION})"
            echo ""
            echo "## Changes"
            echo ""
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          BODY: ${{ steps.notes.outputs.body }}
        run: |
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          echo "$BODY" > /tmp/release-notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE
